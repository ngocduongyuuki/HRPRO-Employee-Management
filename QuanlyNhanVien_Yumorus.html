function mkIcon(paths, viewBox = "0 0 24 24") {
  return function Icon({ size = 16, color = "currentColor", style, ...rest }) {
    return (
      <svg
        width={size}
        height={size}
        viewBox={viewBox}
        fill="none"
        stroke={color}
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }}
        {...rest}
      >
        {paths}
      </svg>
    );
  };
}

function yearsOfService(hireDateStr, ref = new Date()) {
  const hire = new Date(hireDateStr);
  let years = ref.getFullYear() - hire.getFullYear();
  const m = ref.getMonth() - hire.getMonth();
  if (m < 0 || (m === 0 && ref.getDate() < hire.getDate())) years--;
  return years;
}

function formatVND(n) {
  if (!n && n !== 0) return "0 đ";
  return Math.round(Number(n)).toLocaleString("vi-VN") + " đ";
}

function calcPIT(taxable) {
  const brackets = [
    [5000000, 0.05], [10000000, 0.1], [18000000, 0.15], [32000000, 0.2],
    [52000000, 0.25], [80000000, 0.3], [Infinity, 0.35],
  ];
  let tax = 0, prev = 0;
  for (const [upper, rate] of brackets) {
    if (taxable > prev) {
      tax += (Math.min(taxable, upper) - prev) * rate;
      prev = upper;
    } else break;
  }
  return tax;
}

function computePayroll(emp) {
  const base = Number(emp.salary || 0);
  const gross = base + Number(emp.allowance || 0) + Number(emp.bonus || 0);
  const insurance = Math.round(base * 0.105);
  const deduction = 11000000 + Number(emp.dependents || 0) * 4400000;
  const taxable = Math.max(0, gross - insurance - deduction);
  const tax = Math.round(calcPIT(taxable));
  return { gross, insurance, tax, net: gross - insurance - tax };
}

// Tính số ngày nghỉ phép theo NGÀY LÀM VIỆC thực tế (Thứ 2 - Thứ 6).
// Thứ 7 / Chủ Nhật nằm trong khoảng nghỉ sẽ không bị trừ vào số ngày phép.
function leaveDaysCount(from, to) {
  if (!from || !to) return 0;
  const start = new Date(from);
  const end = new Date(to);
  if (isNaN(start.getTime()) || isNaN(end.getTime()) || end < start) return 0;

  let count = 0;
  const cur = new Date(start);
  while (cur <= end) {
    const dow = cur.getDay(); // 0 = Chủ Nhật, 6 = Thứ 7
    if (dow !== 0 && dow !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

    return leaveRequests.filter((r) => r.employeeId === employeeId && r.status === "Đã duyệt").reduce((s, r) => s + leaveDaysCount(r.fromDate, r.toDate), 0);
  }

  function submitLeaveRequest() {
    if (!leaveForm.employeeId || !leaveForm.fromDate || !leaveForm.toDate) return;
    if (new Date(leaveForm.toDate) < new Date(leaveForm.fromDate)) return; // ngày đến phải >= ngày từ
    const newId = leaveRequests.length ? Math.max(...leaveRequests.map((r) => r.id)) + 1 : 1;
    setLeaveRequests((prev) => [...prev, { id: newId, employeeId: Number(leaveForm.employeeId), fromDate: leaveForm.fromDate, toDate: leaveForm.toDate, reason: leaveForm.reason, status: "Chờ duyệt" }]);
    setLeaveModalOpen(false);
    setLeaveForm({ employeeId: "", fromDate: "", toDate: "", reason: "" });
  }
  function setLeaveStatus(id, status) { setLeaveRequests((prev) => prev.map((r) => (r.id === id ? { ...r, status } : r))); }

  // ---- payroll ----
  function updatePayrollField(id, field, value) {
    setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, [field]: Math.max(0, Number(value) || 0) } : e)));
  }
  function submitRaise() {
    const emp = employees.find((e) => e.id === Number(raiseForm.employeeId));
    if (!emp || !raiseForm.newSalary) return;
    const newId = salaryHistory.length ? Math.max(...salaryHistory.map((r) => r.id)) + 1 : 1;
    setSalaryHistory((prev) => [...prev, { id: newId, employeeId: emp.id, date: new Date().toISOString().slice(0, 10), oldSalary: emp.salary, newSalary: Number(raiseForm.newSalary), note: raiseForm.note }]);
    setEmployees((prev) => prev.map((e) => (e.id === emp.id ? { ...e, salary: Number(raiseForm.newSalary) } : e)));
    setRaiseModalOpen(false);
    setRaiseForm({ employeeId: "", newSalary: "", note: "" });
  }

  function batchEmployees() {
    if (batchForm.scope === "department") return employees.filter((e) => e.department === batchForm.department);
    if (batchForm.scope === "selected") return employees.filter((e) => (batchForm.employeeIds || []).includes(e.id));
    return employees;
  }

  function previewBatchSalary(emp) {
    const value = Number(batchForm.increaseValue || 0);
    if (batchForm.increaseType === "percent") return Math.round(emp.salary * (1 + value / 100));
    if (batchForm.increaseType === "amount") return Math.max(0, emp.salary + value);
    return Math.max(0, value);
  }

  function submitBatchRaise() {
    const targets = batchEmployees();
    if (!batchForm.name.trim() || !batchForm.effectiveDate || !targets.length || Number(batchForm.increaseValue) <= 0) return;
    const batchId = salaryBatches.length ? Math.max(...salaryBatches.map((b) => b.id)) + 1 : 1;
    const historyStart = salaryHistory.length ? Math.max(...salaryHistory.map((r) => r.id)) + 1 : 1;
    const records = targets.map((emp, index) => ({
      id: historyStart + index, batchId, employeeId: emp.id, date: batchForm.effectiveDate, oldSalary: emp.salary, newSalary: previewBatchSalary(emp), note: batchForm.note || batchForm.name
    }));
    setSalaryHistory((prev) => [...prev, ...records]);
    setEmployees((prev) => prev.map((e) => { const r = records.find((x) => x.employeeId === e.id); return r ? { ...e, salary: r.newSalary } : e; }));
    setSalaryBatches((prev) => [...prev, { id: batchId, name: batchForm.name.trim(), effectiveDate: batchForm.effectiveDate, scope: batchForm.scope, department: batchForm.scope === "department" ? batchForm.department : "", increaseType: batchForm.increaseType, increaseValue: Number(batchForm.increaseValue), employeeCount: targets.length, note: batchForm.note, status: "Đã áp dụng" }]);

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <div style={{ gridColumn: "1 / -1" }}><label style={label}>Tên đợt tăng lương</label><input style={inputStyle} value={batchForm.name} onChange={(e) => setBatchForm({ ...batchForm, name: e.target.value })} placeholder="Tăng lương định kỳ 2026 - Đợt 1" /></div>
              <div><label style={label}>Ngày áp dụng</label><input type="date" style={inputStyle} value={batchForm.effectiveDate} onChange={(e) => setBatchForm({ ...batchForm, effectiveDate: e.target.value })} /></div>
              <div><label style={label}>Đối tượng áp dụng</label><select style={inputStyle} value={batchForm.scope} onChange={(e) => setBatchForm({ ...batchForm, scope: e.target.value })}><option value="all">Toàn công ty</option><option value="department">Theo phòng ban</option></select></div>
              {batchForm.scope === "department" && <div style={{ gridColumn: "1 / -1" }}><label style={label}>Phòng ban</label><select style={inputStyle} value={batchForm.department} onChange={(e) => setBatchForm({ ...batchForm, department: e.target.value })}>{DEPARTMENTS.map((d) => <option key={d} value={d}>{d}</option>)}</select></div>}
              <div><label style={label}>Cách tăng</label><select style={inputStyle} value={batchForm.increaseType} onChange={(e) => setBatchForm({ ...batchForm, increaseType: e.target.value })}><option value="percent">Tăng theo %</option><option value="amount">Tăng số tiền cố định</option><option value="newSalary">Đặt mức lương mới</option></select></div>
              <div><label style={label}>{batchForm.increaseType === "percent" ? "Tỷ lệ tăng (%)" : batchForm.increaseType === "amount" ? "Số tiền tăng (VNĐ)" : "Mức lương mới (VNĐ)"}</label><input type="number" min="0" style={inputStyle} value={batchForm.increaseValue} onChange={(e) => setBatchForm({ ...batchForm, increaseValue: e.target.value })} placeholder={batchForm.increaseType === "percent" ? "8" : "1000000"} /></div>
              <div style={{ gridColumn: "1 / -1" }}><label style={label}>Ghi chú</label><input style={inputStyle} value={batchForm.note} onChange={(e) => setBatchForm({ ...batchForm, note: e.target.value })} placeholder="Tăng lương định kỳ, đánh giá hiệu suất..." /></div>
            </div>
            {(() => { const targets = batchEmployees(); return <div style={{ marginTop: 18, padding: 14, borderRadius: 8, background: "#F7F9FB", border: `1px solid ${COLORS.border}` }}><div style={{ fontWeight: 600, fontSize: 13.5 }}>Xem trước</div><div style={{ color: COLORS.inkSoft, fontSize: 13, marginTop: 5 }}>Sẽ áp dụng cho <b style={{ color: COLORS.ink }}>{targets.length}</b> nhân viên. {targets.length > 0 && Number(batchForm.increaseValue) > 0 ? `Ví dụ: ${formatVND(targets[0].salary)} → ${formatVND(previewBatchSalary(targets[0]))}` : "Nhập mức tăng để xem mức lương mới."}</div></div> })()}
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 22 }}><button onClick={() => setBatchModalOpen(false)} style={{ padding: "10px 18px", borderRadius: 7, border: `1px solid ${COLORS.border}`, background: "none", cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>Hủy</button><button onClick={submitBatchRaise} disabled={!batchForm.name.trim() || !batchForm.effectiveDate || !batchForm.increaseValue || batchEmployees().length === 0} style={{ padding: "10px 18px", borderRadius: 7, border: "none", cursor: "pointer", background: COLORS.primary, color: "#fff", fontSize: 14, fontWeight: 600, fontFamily: "inherit" }}>Tạo và áp dụng</button></div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EmployeeManager />);
</script>
</body>
</html>
